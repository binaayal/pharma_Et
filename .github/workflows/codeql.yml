name: CodeQL

# Static analysis of the TypeScript (API and console) for the vulnerability classes a
# reviewer is worst at spotting by eye: injection, path traversal, prototype pollution,
# unsafe redirects. Free for public repositories; results land in the Security tab.

permissions:
  contents: read
  security-events: write

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1'

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
