name: CI

# Every gate here blocks a merge (docs/06-delivery-plan.md §6.1, docs/05-qa §12).
# There is no override and no flaky-retry: a flaky guardian test is itself a blocking
# defect, because a gate you re-run until it goes green is not a gate.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege, stated explicitly. `pull-requests: read` is what the path filter needs
# to ask the API which files a PR touches; without it the filter fails, and a failing
# filter is how every downstream job silently skips.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Pinned to an exact stable, not a range. The Dart SDK that ships with it decides how the
  # mobile source is formatted, and a range would silently change that under us.
  FLUTTER_VERSION: '3.47.5'

jobs:
  # Path filtering so a Dart-only change does not rebuild the backend, and vice versa.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      mobile: ${{ steps.filter.outputs.mobile }}
      contracts: ${{ steps.filter.outputs.contracts }}
      migrations: ${{ steps.filter.outputs.migrations }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'packages/contracts/**'
              - 'apps/mobile/lib/contracts/**'
              - 'pnpm-lock.yaml'
            api:
              - 'apps/api/**'
              - 'packages/contracts/**'
              - 'pnpm-lock.yaml'
              # The workflow itself. Several gates live as steps INSIDE this job — the RLS
              # policy check, the docs/04 §2 column convention — so a change to them would
              # otherwise merge without ever executing, which is how a gate that does not
              # work gets trusted. The same reasoning already applies to `rollback_safety`.
              - '.github/workflows/ci.yml'
            dashboard:
              - 'apps/dashboard/**'
              - 'packages/contracts/**'
              - 'pnpm-lock.yaml'
            mobile:
              - 'apps/mobile/**'
              - 'packages/contracts/**'
            docs:
              - 'docs/**'
              - 'scripts/check-traceability.mjs'
            migrations:
              - 'apps/api/src/migrations/**'
              # The job's own definition. A change to the thing that proves rollback safety
              # should have to prove itself, rather than being merged unexercised and
              # discovered to be broken by the first migration that needed it.
              - '.github/workflows/ci.yml'

  contracts:
    name: contracts · codegen freshness
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      # No Dart SDK here on purpose: codegen is pure Node, so its output is identical on
      # every machine regardless of which Flutter anyone has installed.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pharmaet/contracts test
      - name: Regenerate and fail on any diff
        # Proves a contract change landed on BOTH sides. This is the anti-drift gate
        # (ADR-010, docs/05-qa §6): a client and server that disagree about the envelope do
        # not raise an error, they silently lose or duplicate real transactions.
        run: |
          pnpm gen:contracts
          git diff --exit-code -- packages/contracts/generated apps/mobile/lib/contracts \
            || { echo "::error::generated contract output is stale — run 'pnpm gen:contracts' and commit the result"; exit 1; }

  api:
    name: api · lint, unit, integration, guardian
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    services:
      # A REAL PostgreSQL. RLS, constraints and SET LOCAL scoping are the things under test
      # and a mocked database exercises none of them (docs/05-qa §5).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pharmaet
          POSTGRES_PASSWORD: pharmaet_ci
          POSTGRES_DB: pharmaet_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://pharmaet:pharmaet_ci@localhost:5432/pharmaet_ci
      # The suites truncate between runs, so locally they derive a sibling `_test` database
      # rather than wiping a developer's seed. In CI the container is ephemeral, so they are
      # pointed straight at it.
      TEST_DATABASE_URL: postgres://pharmaet:pharmaet_ci@localhost:5432/pharmaet_ci
      DATABASE_APP_USER: pharmaet_app
      DATABASE_APP_PASSWORD: pharmaet_app_ci
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm --filter @pharmaet/api lint && pnpm --filter @pharmaet/api typecheck

      - name: Migrations apply cleanly (schema AND RLS policies)
        run: pnpm --filter @pharmaet/api migration:run

      - name: Every tenant-scoped table carries an RLS policy
        # The application role is non-owner, so RLS actually binds it. A tenant table that
        # reached production without a policy would look fine in every scoped test and leak
        # the first time a query forgot its predicate.
        #
        # Scoped by "has a tenant_id column" rather than by an exclusion list, so it stays
        # true on its own: a new tenant table without RLS fails, and a legitimately
        # non-tenant table — `platform_admin`, which is us — never has to be remembered and
        # added to a list somebody would eventually pad to make the check pass.
        run: |
          UNPROTECTED=$(psql "$DATABASE_URL" -tAc "
            SELECT string_agg(c.relname, ', ')
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE n.nspname = 'public'
               AND c.relkind = 'r'
               AND c.relname <> 'migrations'
               AND EXISTS (
                 SELECT 1 FROM pg_attribute a
                  WHERE a.attrelid = c.oid AND a.attname = 'tenant_id' AND NOT a.attisdropped
               )
               AND NOT c.relrowsecurity;")
          if [ -n "$UNPROTECTED" ]; then
            echo "::error::tenant-scoped tables without row-level security: $UNPROTECTED"
            exit 1
          fi

          # And the converse, so the rule cannot be satisfied by dropping the column: any
          # table WITHOUT a tenant_id must be one we have consciously decided is not tenant
          # data. Naming them here is cheaper than discovering one by accident.
          #
          #   platform_admin  — that is us, not a pharmacy (BR-2.2).
          #   login_attempt   — an attempt may name a tenant that does not exist, and that
          #                     case is the whole point of recording it: refusing to count
          #                     attempts against unknown tenants would make "throttled" mean
          #                     "this pharmacy is real" (ADR-017).
          #   signup_request  — a request for an account that does not exist yet, and may
          #                     never; approval is what creates the tenant (ADR-022).
          NON_TENANT=$(psql "$DATABASE_URL" -tAc "
            SELECT string_agg(c.relname, ', ')
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE n.nspname = 'public'
               AND c.relkind = 'r'
               AND c.relname NOT IN ('migrations', 'tenant', 'platform_admin', 'login_attempt', 'signup_request')
               AND NOT EXISTS (
                 SELECT 1 FROM pg_attribute a
                  WHERE a.attrelid = c.oid AND a.attname = 'tenant_id' AND NOT a.attisdropped
               );")
          if [ -n "$NON_TENANT" ]; then
            echo "::error::tables with no tenant_id that are not on the known list: $NON_TENANT"
            echo "::error::either add the column or add the table to this check, deliberately."
            exit 1
          fi

      - name: Tenant-scoped tables follow the column convention (docs/04 §2)
        # docs/04 §2 states a column set that every tenant-scoped domain table carries. Stated
        # and unenforced, it decays the ordinary way: the next table is written by copying a
        # neighbour, and the first one copied from a partial example spreads the omission.
        #
        # The exceptions are named here rather than inferred, and each is a real design
        # decision. `event` and `oversell_event` are append-only, so `updated_at`/`deleted_at`
        # would describe operations the immutability triggers refuse (ADR-015). `applied_op`
        # is an idempotency key whose identity IS (tenant_id, op_id), so a surrogate `id`
        # would be a second, weaker key. `payment_proof` and `subscription` sit above the
        # terminal sync path, so no `change_seq`. `tenant_change_seq` is the allocator that
        # hands out `change_seq` — a counter of (tenant_id, value), and giving it a sync
        # cursor of its own would be circular.
        run: |
          MISSING=$(psql "$DATABASE_URL" -tAc "
            SELECT string_agg(format('%s (missing: %s)', relname, missing), '; ')
              FROM (
                SELECT c.relname,
                       array_to_string(array_remove(ARRAY[
                         CASE WHEN NOT bool_or(a.attname='id')          THEN 'id' END,
                         CASE WHEN NOT bool_or(a.attname='created_at')  THEN 'created_at' END,
                         CASE WHEN NOT bool_or(a.attname='updated_at')  THEN 'updated_at' END,
                         CASE WHEN NOT bool_or(a.attname='deleted_at')  THEN 'deleted_at' END,
                         CASE WHEN NOT bool_or(a.attname='row_version') THEN 'row_version' END,
                         CASE WHEN NOT bool_or(a.attname='change_seq')  THEN 'change_seq' END
                       ], NULL), ', ') AS missing
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  JOIN pg_attribute a ON a.attrelid = c.oid AND a.attnum > 0 AND NOT a.attisdropped
                 WHERE n.nspname = 'public' AND c.relkind = 'r'
                   AND c.relname NOT IN ('event','oversell_event','applied_op','tenant',
                                         'payment_proof','subscription','tenant_change_seq')
                   AND EXISTS (SELECT 1 FROM pg_attribute t
                                WHERE t.attrelid = c.oid AND t.attname = 'tenant_id'
                                  AND NOT t.attisdropped)
                 GROUP BY c.relname
              ) x
             WHERE missing <> '';")
          if [ -n "$MISSING" ]; then
            echo "::error::tenant-scoped tables missing convention columns: $MISSING"
            echo "::error::docs/04 §2 — add the columns, or add the table to this check with a reason."
            exit 1
          fi
          echo "every tenant-scoped table carries the docs/04 §2 column set"

      - name: Unit tests
        run: pnpm --filter @pharmaet/api test

      - name: Guardian suites (the merge gate — no override, no retry)
        run: pnpm --filter @pharmaet/api test:guardian

      - name: Core end-to-end journeys (Phase 1 exit gate)
        # Guardian suites prove invariants in isolation; these prove the journey a pharmacy
        # actually performs, pushed through /sync/push in outbox order as a terminal does.
        run: pnpm --filter @pharmaet/api test:e2e

      - name: NFR-3 performance budgets
        # Budgets from the SRS, not observations dressed up as targets. Passing proves the
        # shape of the work — one query per report, indexes behind every tenant predicate,
        # no N+1 in the sync path. It does not prove production latency; that is a launch
        # checklist item against hosted staging (docs/06 §11).
        run: pnpm --filter @pharmaet/api test:perf

  dashboard:
    name: dashboard · lint, typecheck, test, build
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pharmaet/dashboard lint
      - run: pnpm --filter @pharmaet/dashboard typecheck
      - run: pnpm --filter @pharmaet/dashboard test
      - run: pnpm --filter @pharmaet/dashboard build

  mobile:
    name: mobile · analyze, format, guardian
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check
        # The same script developers run, so the check and the fix cannot diverge. It skips
        # lib/contracts/, whose canonical form is whatever the emitter produces — running a
        # version-sensitive formatter over generated code makes the contract-freshness gate
        # fail for a reason that has nothing to do with the contract.
        working-directory: .
        run: ./scripts/format-dart.sh --check
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Tests, including the G2/G4/G7 guardian suites
        # G7 closes a real on-disk database and reopens it — a process death from the data's
        # point of view. The device matrix on real low-end Android hardware is a release
        # gate, not a per-PR one (docs/05-qa §7).
        #
        # In the devices' time zone, not the runner's UTC. Where the two agree, a calendar
        # date read as an instant looks correct — which is how every expiry date on a real
        # phone in Addis Ababa came to display one day early with the whole suite green.
        env:
          TZ: Africa/Addis_Ababa
        run: flutter test --exclude-tags latency
      - name: NFR-3.2 latency guard, on its own
        # Run after everything else and alone. Measured concurrently with the other suites,
        # a two-core runner's shared disk produced p50 4.9 ms and p95 133 ms for the same
        # commit — the tail was the neighbours' fsyncs, not this code.
        env:
          TZ: Africa/Addis_Ababa
        run: flutter test --tags latency --concurrency=1

  # The same app, compiled for iPhone. Xcode only runs on macOS, so this is where the iOS
  # half is proven to build at all: a plugin with no iOS implementation, a pod that will not
  # resolve, or a Swift-side break fails here instead of on the day someone tries to ship.
  # Unsigned — signing belongs to the release pipeline and its Apple account, not to CI.
  mobile_ios:
    name: mobile · iOS build
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build for iOS (unsigned)
        run: >
          flutter build ios --release --no-codesign
          --dart-define=API_BASE_URL=https://pharmaet-staging.fly.dev/api

  # The single required check for branch protection.
  #
  # `changes` is in `needs` on purpose. Without it, a failure in the path filter made every
  # downstream job *skip*, and a gate that accepts "skipped" then reported a green tick over
  # a run in which nothing was tested. A gate that cannot fail is not a gate — this one is
  # written so the most likely infrastructure failure turns it red, not green.

  rollback_safety:
    name: rollback safety · previous code on the new schema
    needs: changes
    # Only when a migration is added or changed. Every other PR cannot break this by
    # construction, and a job that runs on nothing teaches people to ignore it.
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pharmaet
          POSTGRES_PASSWORD: pharmaet_ci
          POSTGRES_DB: pharmaet_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://pharmaet:pharmaet_ci@localhost:5432/pharmaet_ci
      TEST_DATABASE_URL: postgres://pharmaet:pharmaet_ci@localhost:5432/pharmaet_ci
      DATABASE_APP_USER: pharmaet_app
      DATABASE_APP_PASSWORD: pharmaet_app_ci
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      NODE_ENV: test

    steps:
      # docs/06 §6.2: migrations are **forward-only**, so a rollback is "redeploy the
      # previous image" — against a database that has already been migrated forward. That
      # makes the question this job asks the only one that matters: **does the code we are
      # replacing still work on the schema we are shipping?**
      #
      # Testing `down()` would answer a question production never asks. It is why `down()`
      # exists for local iteration and is documented as not being the production rollback
      # path (see InitialSchema). Expand-then-contract is the rule; this job is what makes
      # the rule true rather than merely intended.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }

      - name: Take the schema this PR ships
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @pharmaet/api migration:run
          echo "migrations applied from PR head"

      - name: Put the previous release's code back, keeping that schema
        run: |
          # `git checkout <ref> -- <path>` restores what the ref HAS; it does not remove what
          # the PR ADDED. Without the rm, a PR's new test files would survive and run against
          # the old code they were written for — the job would fail for a reason that has
          # nothing to do with rollback, and its real signal would be lost in the noise.
          rm -rf apps/api/src apps/api/test packages/contracts/src
          git checkout "origin/${{ github.base_ref }}" -- \
            apps/api/src apps/api/test packages/contracts/src

          # Everything reverts EXCEPT the migrations directory. Keeping the new migration
          # files matters: the harness runs `migration:run` in its global setup, and if they
          # vanished it would build a fresh database at the OLD schema — the job would go
          # green having tested nothing.
          git checkout HEAD -- apps/api/src/migrations

          pnpm install --frozen-lockfile
          # The contracts package must be rebuilt from the restored sources. `test:guardian`
          # has no pretest hook, so without this the suites fail on a missing module rather
          # than on anything about the schema.
          pnpm --filter @pharmaet/contracts build

          echo "### Rolled back to \`origin/${{ github.base_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          git diff --stat HEAD -- apps/api/src packages/contracts/src >> "$GITHUB_STEP_SUMMARY"

      - name: The previous code must pass on the new schema
        # If this fails, the PR's migration is not backward-compatible and a rollback would
        # take the pharmacy down rather than save it. The fix is expand-then-contract: add
        # the new shape now, remove the old one in a later release, once nothing runs on it.
        run: pnpm --filter @pharmaet/api test:guardian

      - name: Summary
        if: always()
        run: |
          echo "Previous release's guardian suites ran against this PR's schema." \
            >> "$GITHUB_STEP_SUMMARY"
          echo "A pass means redeploying the previous image over this migration is safe." \
            >> "$GITHUB_STEP_SUMMARY"


  traceability:
    name: traceability · the RTM points at things that exist
    needs: changes
    # Any docs change, and any source change — because deleting a file the RTM cites breaks
    # the table just as surely as editing the table does, and only one of those two edits
    # happens in docs/.
    if: >-
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.mobile == 'true' ||
      needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # docs/05-qa §8 and docs/06 §11 make the RTM the evidence that every requirement has
      # code and a test behind it. Prose does not compile, so a renamed file leaves the claim
      # standing and silently false. This is the thing that fails.
      - run: node scripts/check-traceability.mjs

      # Outstanding gates are the normal condition of a project before GA and must not turn
      # every build red. A ticked box citing evidence that does not exist is a different
      # thing: it is a false claim about release readiness, and the day to catch it is the
      # day it is written rather than the day somebody tries to ship on it.
      - name: Launch-readiness claims are substantiated (docs/06 §11)
        run: node scripts/release-readiness.mjs --evidence-only


  coverage:
    name: coverage · a trend, not a gate
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pharmaet
          POSTGRES_PASSWORD: pharmaet_ci
          POSTGRES_DB: pharmaet_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://pharmaet:pharmaet_ci@localhost:5432/pharmaet_ci
      TEST_DATABASE_URL: postgres://pharmaet:pharmaet_ci@localhost:5432/pharmaet_ci
      DATABASE_APP_USER: pharmaet_app
      DATABASE_APP_PASSWORD: pharmaet_app_ci
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pharmaet/api migration:run

      # docs/05-qa §16 asks for "coverage per tier as a trend, not a target", and §3 makes it
      # a secondary signal behind the guardian suites. So this reports and never gates on a
      # percentage.
      #
      # It exists because ci-cd.md listed per-tier coverage among the things that block a PR
      # while nothing anywhere produced a coverage number — and `test:cov` had in fact never
      # run to completion. A documented control that does not exist is worse than an absent
      # one, because it is counted on.
      #
      # Its own job rather than a step in `api`: it re-runs every suite, so inside that job it
      # would double the runtime for a number nobody blocks on. Beside it, the wall clock is
      # unchanged and a coverage problem cannot be mistaken for a guardian failure.
      - name: Measure
        run: pnpm --filter @pharmaet/api test:cov 2>&1 | tee coverage.txt

      - name: Report
        if: always()
        run: |
          {
            echo "### API coverage — a trend, not a gate (docs/05-qa §16)"
            echo '```'
            grep -E "^(File|All files|-{3,})" coverage.txt || echo "no coverage table produced"
            echo '```'
            echo "_Per-tier targets in docs/05-qa §3 are a signal. The gate is the guardian suites._"
          } >> "$GITHUB_STEP_SUMMARY"

  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, contracts, api, dashboard, mobile, mobile_ios, rollback_safety, traceability, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded or was legitimately skipped
        run: |
          echo "changes:   ${{ needs.changes.result }}"
          echo "contracts: ${{ needs.contracts.result }}"
          echo "api:       ${{ needs.api.result }}"
          echo "dashboard: ${{ needs.dashboard.result }}"
          echo "mobile:    ${{ needs.mobile.result }}"
          echo "ios:       ${{ needs.mobile_ios.result }}"
          echo "rollback:  ${{ needs.rollback_safety.result }}"
          echo "tracing:   ${{ needs.traceability.result }}"
          echo "coverage:  ${{ needs.coverage.result }}"

          # The filter itself must have run. A skip here means nothing downstream was even
          # considered.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::the path filter did not succeed — no build job was evaluated"
            exit 1
          fi

          for r in "${{ needs.contracts.result }}" "${{ needs.api.result }}" \
                   "${{ needs.dashboard.result }}" "${{ needs.mobile.result }}" \
                   "${{ needs.mobile_ios.result }}" \
                   "${{ needs.rollback_safety.result }}" \
                   "${{ needs.traceability.result }}" \
                   "${{ needs.coverage.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job reported '$r'"; exit 1 ;;
            esac
          done
