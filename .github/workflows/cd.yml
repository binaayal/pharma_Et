name: CD

# The promotion path (docs/06-delivery-plan.md §6.2):
#
#   merge → build image (API + dashboard) → verify end to end → deploy staging → smoke → [gate] → production
#
# The dashboard is built INTO the API image and served by it (docs/03 §7), so there is one
# artifact, one origin and one deploy target. GitHub Pages was the alternative and is not
# available on a free private repository — but same-origin is the better answer regardless:
# it removes CORS from the picture and makes it impossible to run a console against a server
# it was not built for.
#
# The verification step is the part worth pointing at. Before anything reaches a hosted
# environment, CD stands up the *built image* against a real Postgres, runs the real
# migrations, and drives scripts/smoke.sh through the whole walking skeleton over HTTP. A
# deploy that would have failed fails here instead, on a stack nobody depends on.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Also deploy to production (requires the production environment gate)'
        type: boolean
        default: false

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------- build
  image:
    name: build & publish API image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          # GHCR rejects any uppercase in a repository name, and this repo is `pharma_Et`.
          # github.repository preserves the casing, so it is lowercased here rather than
          # interpolated directly. Underscores are legal in an image path; uppercase is not.
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/api" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          # Immutable sha tag is what gets deployed and what a rollback names; `latest` is a
          # convenience for humans and is never what a deploy references.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------- staging verification
  verify:
    name: verify the built image end to end
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stand up the staging stack from the published image
        env:
          API_IMAGE: ${{ needs.image.outputs.image }}:${{ needs.image.outputs.tag }}
          JWT_SECRET: ci-verification-secret-not-a-real-one
        run: |
          docker compose -f docker-compose.staging.yml up -d --wait
          docker compose -f docker-compose.staging.yml ps

      - name: Smoke the walking skeleton over HTTP
        run: ./scripts/smoke.sh http://localhost:3100/api

      - name: Confirm the dashboard ships in the image
        run: |
          curl -fsS http://localhost:3100/ | grep -q '<div id="root">' \
            && echo "dashboard served from the API" \
            || { echo "::error::the dashboard bundle is missing from the image"; exit 1; }
          # An unmatched /api route must still 404, not fall through to index.html — a 200
          # full of HTML is a corrupt response as far as any client is concerned.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/api/nope)
          [ "$code" = "404" ] || { echo "::error::/api fell through to the SPA (got $code)"; exit 1; }
          echo "unmatched /api routes still 404"
          # A deep link or a refresh must land on the app, not a 404 — the one thing a
          # static host gives for free and a hand-written fallback has to earn.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/tenants)
          [ "$code" = "200" ] || { echo "::error::SPA deep link returned $code"; exit 1; }
          echo "deep links fall back to the app"

      - name: Prove the migration is re-runnable (idempotent, forward-only)
        env:
          API_IMAGE: ${{ needs.image.outputs.image }}:${{ needs.image.outputs.tag }}
        run: |
          # A deploy that retries must not fail on the migration step, and a re-run must not
          # re-apply. This is the cheapest place to find out.
          docker compose -f docker-compose.staging.yml run --rm migrate

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.staging.yml logs --no-color | tail -200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v

  # ------------------------------------------------------------ deploy API
  deploy-staging-api:
    name: deploy API to staging
    needs: [image, verify]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://pharmaet-staging.fly.dev
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy is configured
        id: configured
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Staging API not deployed"
              echo ""
              echo "\`FLY_API_TOKEN\` is not set, so this job had nothing to deploy to."
              echo "The image is built, published and verified — only the hosted target is missing."
              echo ""
              echo "See \`docs/engineering/staging.md\` for the three commands that fix this."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.configured.outputs.configured == 'true'

      - name: Deploy
        if: steps.configured.outputs.configured == 'true'
        working-directory: apps/api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # The release command runs migrations before the new version takes traffic, from
          # the same image that will serve it (fly.toml [deploy]). Rolling strategy, so the
          # N-1 sync contract stays served throughout (ADR-009).
          flyctl deploy --remote-only --wait-timeout 300

      - name: Seed staging if it is empty
        if: steps.configured.outputs.configured == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Synthetic fixtures only (docs/06 §5). The seed refuses to run against a database
          # that already holds tenants, so re-running it on every deploy is safe.
          flyctl ssh console -a pharmaet-staging -C "/usr/local/bin/entrypoint seed" || \
            echo "::notice::seed skipped (already seeded, or ssh unavailable)"

      - name: Post-deploy smoke against the live URL
        if: steps.configured.outputs.configured == 'true'
        run: ./scripts/smoke.sh https://pharmaet-staging.fly.dev/api

      - name: Confirm the dashboard is served from the same origin
        if: steps.configured.outputs.configured == 'true'
        run: |
          # The console and the API are one deployment. If this 404s, the bundle did not
          # make it into the image and staging is only half there.
          curl -fsS https://pharmaet-staging.fly.dev/ | grep -q '<div id="root">' \
            && echo "dashboard served at https://pharmaet-staging.fly.dev/" \
            || { echo "::error::the dashboard bundle is not in the image"; exit 1; }

  # ------------------------------------------------------------- production
  deploy-production:
    name: deploy to production
    needs: [image, deploy-staging-api]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    runs-on: ubuntu-latest
    # A protected environment with required reviewers is the manual release gate
    # (docs/06 §6.2). Production is ALSO gated on the GA checklist in §11, evaluated
    # mechanically by `scripts/release-readiness.mjs` — two independent gates, because a
    # reviewer approving a release is exactly the moment somebody is least likely to re-read
    # a nine-line checklist.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # The gate reads docs/06 §11 itself rather than restating it, so it cannot drift from
      # the checklist it enforces, and it names what is actually outstanding today instead of
      # a message written months ago. A box counts only when it is ticked AND cites evidence
      # that exists — because the failure this guards against is not forgetting to check, it
      # is ticking on a day when shipping feels more urgent than the checklist.
      - name: Launch readiness (docs/06 §11)
        run: node scripts/release-readiness.mjs

      # Everything below runs only once the gate passes. It has never passed.
      - name: Deploy
        run: |
          echo "::error::no production environment is configured yet."
          echo "::error::Stand one up per engineering/staging.md before enabling this step."
          exit 1

  # ---------------------------------------------------------------- mobile
  #
  # The phone apps are released from the same merge as the server they talk to, and built
  # against staging. Each job checks for its own signing secrets and, if they are missing,
  # says so in the run summary and does nothing else, the same way the staging deploy does.
  # What to create, and where to put it: docs/engineering/mobile-release.md.

  release-android:
    name: release Android (signed bundle + APK)
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: '3.47.5'
      API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://pharmaet-staging.fly.dev/api' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing is configured
        id: configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Android release not built"
              echo ""
              echo "\`ANDROID_UPLOAD_KEYSTORE_B64\` is not set. A bundle signed with anything else is"
              echo "refused by Google Play and cannot update an install signed with the real key,"
              echo "so this job builds nothing rather than something that looks shippable."
              echo ""
              echo "See \`docs/engineering/mobile-release.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.configured.outputs.configured == 'true'
        with: { distribution: temurin, java-version: '17' }

      - uses: subosito/flutter-action@v2
        if: steps.configured.outputs.configured == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Write the upload key
        if: steps.configured.outputs.configured == 'true'
        working-directory: apps/mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          # Outside the workspace, so no later step can upload it by accident.
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Build
        if: steps.configured.outputs.configured == 'true'
        working-directory: apps/mobile
        run: |
          # The run number is the version code, so every merge is installable over the last.
          flutter pub get
          flutter build appbundle --release --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          flutter build apk --release --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          rm -f android/key.properties

      - name: Prove it is signed with the upload key, not the debug key
        if: steps.configured.outputs.configured == 'true'
        working-directory: apps/mobile
        run: |
          signer=$(keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -m1 'Owner:')
          echo "$signer"
          if echo "$signer" | grep -q 'CN=Android Debug'; then
            echo "::error::the release APK is debug-signed"; exit 1
          fi
          {
            echo "### Android release built"
            echo ""
            echo "- version code \`${{ github.run_number }}\`, API \`$API_BASE_URL\`"
            echo "- signer: \`$signer\`"
            echo "- the \`pharmaet-android\` artifact holds the Play bundle (.aab) and a direct-install .apk"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.configured.outputs.configured == 'true'
        with:
          name: pharmaet-android
          retention-days: 30
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  release-ios:
    name: release iOS (TestFlight)
    runs-on: macos-latest
    env:
      FLUTTER_VERSION: '3.47.5'
      API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://pharmaet-staging.fly.dev/api' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing is configured
        id: configured
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_B64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_B64" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### iOS release not built"
              echo ""
              echo "The App Store Connect API key or the Apple team ID is not set. Installing on an"
              echo "iPhone outside Xcode needs an Apple Developer Program membership; CI still"
              echo "proves the app compiles for iOS on every mobile change."
              echo ""
              echo "See \`docs/engineering/mobile-release.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.configured.outputs.configured == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build, sign and upload to TestFlight
        if: steps.configured.outputs.configured == 'true'
        working-directory: apps/mobile
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_B64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Automatic, cloud-managed signing with the API key: no certificate or profile is
          # kept in this repository or its secrets. altool finds the key in this directory.
          keydir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keydir"
          echo "$ASC_KEY_P8_B64" | base64 -d > "$keydir/AuthKey_$ASC_KEY_ID.p8"
          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$keydir/AuthKey_$ASC_KEY_ID.p8"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          flutter pub get
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL="$API_BASE_URL"

          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            "${auth[@]}" archive

          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/ipa" \
            "${auth[@]}"

          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP"/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

          {
            echo "### iOS build uploaded to TestFlight"
            echo ""
            echo "- build \`${{ github.run_number }}\`, API \`$API_BASE_URL\`"
            echo "- it appears in App Store Connect → TestFlight after Apple finishes processing it"
          } >> "$GITHUB_STEP_SUMMARY"
