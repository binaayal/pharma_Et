name: CD

# The promotion path (docs/06-delivery-plan.md §6.2):
#
#   merge → build image (API + dashboard) → verify end to end → deploy staging → smoke → [gate] → production
#
# The dashboard is built INTO the API image and served by it (docs/03 §7), so there is one
# artifact, one origin and one deploy target. GitHub Pages was the alternative and is not
# available on a free private repository — but same-origin is the better answer regardless:
# it removes CORS from the picture and makes it impossible to run a console against a server
# it was not built for.
#
# The verification step is the part worth pointing at. Before anything reaches a hosted
# environment, CD stands up the *built image* against a real Postgres, runs the real
# migrations, and drives scripts/smoke.sh through the whole walking skeleton over HTTP. A
# deploy that would have failed fails here instead, on a stack nobody depends on.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Also deploy to production (requires the production environment gate)'
        type: boolean
        default: false

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------- build
  image:
    name: build & publish API image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          # GHCR rejects any uppercase in a repository name, and this repo is `pharmaEt`.
          # github.repository preserves the owner's casing, so it is lowercased here rather
          # than interpolated directly.
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/api" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          # Immutable sha tag is what gets deployed and what a rollback names; `latest` is a
          # convenience for humans and is never what a deploy references.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------- staging verification
  verify:
    name: verify the built image end to end
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stand up the staging stack from the published image
        env:
          API_IMAGE: ${{ needs.image.outputs.image }}:${{ needs.image.outputs.tag }}
          JWT_SECRET: ci-verification-secret-not-a-real-one
        run: |
          docker compose -f docker-compose.staging.yml up -d --wait
          docker compose -f docker-compose.staging.yml ps

      - name: Smoke the walking skeleton over HTTP
        run: ./scripts/smoke.sh http://localhost:3100/api

      - name: Confirm the dashboard ships in the image
        run: |
          curl -fsS http://localhost:3100/ | grep -q '<div id="root">' \
            && echo "dashboard served from the API" \
            || { echo "::error::the dashboard bundle is missing from the image"; exit 1; }
          # An unmatched /api route must still 404, not fall through to index.html — a 200
          # full of HTML is a corrupt response as far as any client is concerned.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/api/nope)
          [ "$code" = "404" ] || { echo "::error::/api fell through to the SPA (got $code)"; exit 1; }
          echo "unmatched /api routes still 404"
          # A deep link or a refresh must land on the app, not a 404 — the one thing a
          # static host gives for free and a hand-written fallback has to earn.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/tenants)
          [ "$code" = "200" ] || { echo "::error::SPA deep link returned $code"; exit 1; }
          echo "deep links fall back to the app"

      - name: Prove the migration is re-runnable (idempotent, forward-only)
        env:
          API_IMAGE: ${{ needs.image.outputs.image }}:${{ needs.image.outputs.tag }}
        run: |
          # A deploy that retries must not fail on the migration step, and a re-run must not
          # re-apply. This is the cheapest place to find out.
          docker compose -f docker-compose.staging.yml run --rm migrate

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.staging.yml logs --no-color | tail -200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v

  # ------------------------------------------------------------ deploy API
  deploy-staging-api:
    name: deploy API to staging
    needs: [image, verify]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://pharmaet-staging.fly.dev
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy is configured
        id: configured
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Staging API not deployed"
              echo ""
              echo "\`FLY_API_TOKEN\` is not set, so this job had nothing to deploy to."
              echo "The image is built, published and verified — only the hosted target is missing."
              echo ""
              echo "See \`docs/engineering/staging.md\` for the three commands that fix this."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.configured.outputs.configured == 'true'

      - name: Deploy
        if: steps.configured.outputs.configured == 'true'
        working-directory: apps/api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # The release command runs migrations before the new version takes traffic, from
          # the same image that will serve it (fly.toml [deploy]). Rolling strategy, so the
          # N-1 sync contract stays served throughout (ADR-009).
          flyctl deploy --remote-only --wait-timeout 300

      - name: Seed staging if it is empty
        if: steps.configured.outputs.configured == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Synthetic fixtures only (docs/06 §5). The seed refuses to run against a database
          # that already holds tenants, so re-running it on every deploy is safe.
          flyctl ssh console -a pharmaet-staging -C "/usr/local/bin/entrypoint seed" || \
            echo "::notice::seed skipped (already seeded, or ssh unavailable)"

      - name: Post-deploy smoke against the live URL
        if: steps.configured.outputs.configured == 'true'
        run: ./scripts/smoke.sh https://pharmaet-staging.fly.dev/api

      - name: Confirm the dashboard is served from the same origin
        if: steps.configured.outputs.configured == 'true'
        run: |
          # The console and the API are one deployment. If this 404s, the bundle did not
          # make it into the image and staging is only half there.
          curl -fsS https://pharmaet-staging.fly.dev/ | grep -q '<div id="root">' \
            && echo "dashboard served at https://pharmaet-staging.fly.dev/" \
            || { echo "::error::the dashboard bundle is not in the image"; exit 1; }

  # ------------------------------------------------------------- production
  deploy-production:
    name: deploy to production
    needs: [image, deploy-staging-api]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    runs-on: ubuntu-latest
    # A protected environment with required reviewers is the manual release gate
    # (docs/06 §6.2). Production is also gated on the GA checklist in §11 — A-1 verified,
    # a restore drill, field UAT — none of which is met during Phase 0.
    environment: production
    steps:
      - name: Refuse until the GA checklist is met
        run: |
          echo "::error::production is gated on the launch-readiness checklist (docs/06 §11)."
          echo "::error::Outstanding: A-1 unverified, no restore drill, no field UAT, compliance tests provisional."
          exit 1
