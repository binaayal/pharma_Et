include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Regenerated by `pnpm gen:contracts` from packages/contracts. Hand-editing it is the
    # drift ADR-010 exists to prevent, so the analyzer does not police its style.
    - lib/contracts/contracts.dart
    - build/**
    - android/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - unawaited_futures
    # Money must never be a double (docs/04 §3, guardian G4). This does not catch that on
    # its own, but it removes the implicit int->double conversions that make it easy.
    - avoid_double_and_int_checks
