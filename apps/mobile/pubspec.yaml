name: pharmaet_mobile
description: >
  PharmaEt counter app — offline-first POS, dispensing and stock for Ethiopian pharmacies.
  Android is the primary build and test target (ADR-001).
publish_to: 'none'
version: 2.0.0+1

environment:
  # Dart 3 for sealed classes and exhaustive switches — the generated contract union relies
  # on both (packages/contracts, ADR-010). CI pins Flutter 3.47.5; see docs/engineering.
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local persistence. The whole product rests on this: a sale is committed to SQLite and
  # durable BEFORE any network attempt, so a power cut costs nothing (NFR-1.3, ADR-002).
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Client-generated, time-ordered identifiers, mintable offline (ADR-006).
  uuid: ^4.5.1

  http: ^1.2.2

  # Cached auth material lives in platform secure storage, never in shared preferences
  # (NFR-4.2).
  flutter_secure_storage: ^9.2.2

  connectivity_plus: ^6.0.5
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  http_parser: ^4.1.2
  share_plus: ^12.0.2
  crypto: ^3.0.7
  clock: ^1.1.3
  # Opens the public privacy and account-deletion pages, and dials support — both stores
  # require those to be reachable from inside the app.
  url_launcher: ^6.3.2
  # The camera as a barcode scanner (FR-13, ADR-031). Its detector is bundled in the app
  # rather than fetched from Play Services on first use: the first scan must work in a
  # shop with no network.
  mobile_scanner: ^7.4.2
  # Receipts on paper (FR-14): lays the receipt out as a PDF and hands it to the phone's
  # own print system — any printer with a print service, or "Save as PDF".
  printing: ^5.15.1
  pdf: ^3.13.1
  # Backup files (FR-15, ADR-033): AES-256-GCM for the file — pure Dart, so it behaves
  # the same on every phone — and the system file picker to choose one to restore.
  cryptography: ^2.9.0
  file_selector: ^1.1.0
  flutter_file_dialog: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs a test ON the device rather than on the build machine. NFR-3.2 is a device figure —
  # cheap Android eMMC does not fsync like a CI runner — so the only honest measurement is
  # one taken on the handset (docs/05-qa §7).
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # In-memory/on-disk SQLite for the Dart VM, so the offline suites run in CI without a
  # device or emulator.
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  # The logo only. `icon-source.png` beside it is the input to scripts/make-app-icons.py and
  # has no business in the app bundle.
  assets:
    - assets/brand/logo.png
    # The medicines list the product form suggests from (FR-12). Generated from EFDA's
    # Essential Medicines List by scripts/build-medicines-catalogue.py — do not hand-edit.
    - assets/catalogue/medicines.json
    # The font a printed receipt is set in (FR-14). The PDF library's built-in fonts have
    # no Ethiopic glyphs; without this an Amharic receipt prints as empty boxes. Bundled,
    # not fetched: printing must work with no network. SIL OFL 1.1 — assets/fonts/OFL.txt.
    - assets/fonts/NotoSansEthiopic-Regular.ttf
