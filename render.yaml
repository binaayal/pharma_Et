# Render Blueprint (docs/engineering/hosting.md). Render → Blueprints → New → this repo.
#
# One web service that runs the image CD has already built and verified — Render never builds
# PharmaEt itself. CD publishes ghcr.io/<owner>/<repo>/api:sha-<commit>, runs the migrations
# against Neon, and only then calls this service's deploy hook with that exact image. So what
# runs is byte-for-byte what was tested, and a rollback is "deploy the previous sha" (runbook).
#
# Moving up a plan is one line — `plan: starter` — and nothing else in this file or in the
# app changes. See hosting.md §5 for what each paid step buys.
services:
  - type: web
    name: pharmaet
    runtime: image
    image:
      # Public on GHCR (anonymous pull verified 2026-10-01), so Render needs no credential.
      # If the package is ever made private, add a registry credential named `ghcr` in
      # Render and put back:  creds: { fromRegistryCreds: { name: ghcr } }
      url: ghcr.io/binaayal/pharma_et/api:latest
    plan: free
    # Frankfurt: the Render region closest to Addis Ababa, and the same one Neon and R2 use,
    # so a sync never crosses a continent twice.
    region: frankfurt
    healthCheckPath: /api/health
    # CD decides when to deploy (after verification and migration), never a push.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # Two hops: Render's edge, then an internal proxy (10.x). With '1', /api/health reported
      # the internal proxy as every client — one login-throttle counter for every pharmacy.
      # Confirm with /api/health → clientIp = your own public IP (hosting.md §7).
      - key: TRUST_PROXY
        value: '2'
      - key: DATABASE_APP_USER
        value: pharmaet_app
      # Screenshots in Postgres for now (ADR-028): no object storage account yet. When R2 or
      # B2 is set up, change this to `s3` and add S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID and
      # S3_SECRET_ACCESS_KEY (hosting.md §3) — no code change.
      - key: PROOF_STORAGE
        value: db
      # Secrets: entered once in the dashboard, never committed.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_APP_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PROOF_ENCRYPTION_KEY
        sync: false
